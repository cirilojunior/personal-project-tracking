spring.application.name=tracker
spring.profiles.default=dev

server.port=8080

# H2 em memória (dados são perdidos ao reiniciar)
spring.datasource.url=jdbc:h2:mem:tracker;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema gerenciado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

# Aging WIP: faixas de cor (em dias)
tracker.aging.limite-atencao-dias=5
tracker.aging.limite-critico-dias=10
